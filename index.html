<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PizTok V101 FIXED</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body{background:#000;color:#fff;margin:0;overflow:hidden;font-family:sans-serif}
.snap{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.snap::-webkit-scrollbar{display:none}
.item{height:100vh;width:100vw;position:relative;display:flex;justify-content:center;background:#111;scroll-snap-align:start}
.item video{height:100%;width:100%;max-width:420px;object-fit:cover}
.right{position:absolute;right:10px;bottom:110px;display:flex;flex-direction:column;gap:18px;align-items:center;z-index:10}
.btn{width:48px;height:48px;background:rgba(255,255,255,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.info{position:absolute;bottom:95px;left:12px;right:80px;z-index:10;text-shadow:0 1px 2px #000}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0;z-index:99}
.top{position:fixed;top:0;left:0;right:0;z-index:99;display:flex;gap:25px;justify-content:center;padding:14px;background:linear-gradient(#000,transparent)}
</style>
</head>
<body>
<div class="top"><b style="border-bottom:2px solid #fff">For You</b><b style="color:#888">Following</b></div>
<div id="feed" class="snap"></div>
<div class="nav">
<div style="text-align:center"><i class="fa-solid fa-house"></i><br><span style="font-size:9px">Home</span></div>
<div style="text-align:center" onclick="location.reload()"><i class="fa-solid fa-rotate"></i><br><span style="font-size:9px">Refresh</span></div>
<div onclick="document.getElementById('up').click()" style="background:#fff;color:#000;padding:6px 16px;border-radius:6px"><i class="fa-solid fa-plus"></i></div>
<div style="text-align:center"><i class="fa-solid fa-inbox"></i><br><span style="font-size:9px">Inbox</span></div>
<div style="text-align:center"><i class="fa-regular fa-user"></i><br><span style="font-size:9px">Profile</span></div>
</div>
<input type="file" id="up" accept="video/*" hidden>
<script>
let DB = JSON.parse(localStorage.getItem('piz101')||'null');
if(!DB){
DB={videos:[{id:1,url:"https://www.w3schools.com/html/mov_bbb.mp4",owner:"piztok_official",cap:"V101 DON WORK! 🔥 If you see this video playing, your PizTok don LIVE! Now tap + to upload your own video #fyp"}]};
localStorage.setItem('piz101',JSON.stringify(DB));
}
let feed=document.getElementById('feed');
function render(){
feed.innerHTML=DB.videos.map(v=>`<div class="item"><video src="${v.url}" loop autoplay muted playsinline controls style="display:block"></video><div class="info"><b>@${v.owner}</b><p style="font-size:14px;margin-top:6px">${v.cap}</p><p style="font-size:12px;margin-top:4px">♫ Original sound - PizTok</p></div><div class="right"><img src="https://i.pravatar.cc/100?u=${v.owner}" style="width:50px;height:50px;border-radius:50%;border:2px solid #fff"><div class="btn" onclick="this.style.color='red'">❤️<br><span style="font-size:10px">999</span></div><div class="btn"><i class="fa-solid fa-comment-dots"></i></div><div class="btn"><i class="fa-solid fa-share"></i></div></div></div>`).join('');
let vid=feed.querySelector('video'); if(vid){vid.play().catch(()=>{});}
}
document.getElementById('up').addEventListener('change',e=>{
let f=e.target.files[0]; if(!f)return;
let url=URL.createObjectURL(f);
DB.videos.unshift({id:Date.now(),url:url,owner:"you",cap:"My first PizTok video 🚀 #trending"});
localStorage.setItem('piz101',JSON.stringify(DB));
render();
alert("Video Added! ✅ Scroll to see am");
});
render();
</script>
</body>
</html>
