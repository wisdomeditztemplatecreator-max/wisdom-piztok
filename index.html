<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Wisdom PizTok V50</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body{background:#000;color:#fff;overscroll-behavior:none;margin:0}
video{object-fit:cover}
.no-scrollbar::-webkit-scrollbar{display:none}
</style>
</head>
<body class="bg-black text-white">

<!-- HEADER -->
<div class="fixed top-0 left-0 right-0 z-20 flex justify-center gap-6 py-3 bg-gradient-to-b from-black/80 to-transparent">
<button id="tabForYou" onclick="switchTab('foryou')" class="font-bold text-white border-b-2 border-white pb-1">For You</button>
<button id="tabFollowing" onclick="switchTab('following')" class="font-bold text-zinc-400">Following</button>
</div>

<!-- FEED -->
<div id="feed" class="h-screen w-screen overflow-y-scroll snap-y snap-mandatory no-scrollbar"></div>

<!-- PROFILE GRID -->
<div id="profilePage" class="hidden min-h-screen pt-14 max-w-[500px] mx-auto">
<div class="p-4 flex gap-4 items-center">
<img src="https://i.pravatar.cc/100" class="w-20 h-20 rounded-full">
<div><h2 class="font-bold text-lg">@you</h2><p id="vidCount" class="text-zinc-400 text-sm">0 videos</p></div>
</div>
<div id="pGrid" class="grid grid-cols-3 gap-[2px] mt-2"></div>
<p id="noVid" class="text-center text-zinc-500 mt-10 hidden">No videos yet. Upload!</p>
</div>

<!-- BOTTOM NAV -->
<div class="fixed bottom-0 left-0 right-0 z-30 bg-black border-t border-zinc-900 flex justify-around py-2">
<button onclick="showPage('feed')" class="flex flex-col items-center"><i class="fa-solid fa-house"></i><span class="text-[10px]">Home</span></button>
<button onclick="document.getElementById('fileUp').click()" class="flex flex-col items-center"><div class="bg-white text-black px-3 py-1 rounded-md"><i class="fa-solid fa-plus"></i></div><span class="text-[10px] mt-1">Upload</span></button>
<button onclick="showPage('profile')" class="flex flex-col items-center"><i class="fa-regular fa-user"></i><span class="text-[10px]">Profile</span></button>
</div>

<input type="file" id="fileUp" accept="video/*" hidden>

<script>
let DB = JSON.parse(localStorage.getItem('piztok_v50') || '{"videos":[]}');
let ME = {handle:'you'};
let currentTab = 'foryou';

function save(){localStorage.setItem('piztok_v50', JSON.stringify(DB));}

document.getElementById('fileUp').addEventListener('change', function(e){
 let f=e.target.files[0]; if(!f)return;
 let url=URL.createObjectURL(f);
 let nv={id:Date.now(), url:url, owner:'you', caption:'My new video #piztok', likes: Math.floor(Math.random()*100), liked:false, comments:[], isFollowing:false};
 DB.videos.unshift(nv);
 save(); renderAll();
 alert('Uploaded! Go to Profile to see it - NO BLACK!');
});

function renderAll(){renderFeed();renderP();}

function renderFeed(){
 let fd=document.getElementById('feed');
 let list = currentTab==='following'? DB.videos.filter(v=>v.isFollowing) : DB.videos;
 if(list.length===0){ fd.innerHTML=`<div class="h-screen flex items-center justify-center text-zinc-500">No videos in ${currentTab}. Upload one!</div>`; return; }
 fd.innerHTML=list.map(v=>`
 <div class="h-screen w-screen snap-start relative bg-zinc-900 flex items-center justify-center overflow-hidden">
   <video src="${v.url}" loop playsinline class="h-full w-full max-w-[400px] object-cover" onclick="this.paused?this.play():this.pause()"></video>
   <div class="absolute bottom-20 left-3 right-16">
     <p class="font-bold">@${v.owner}</p>
     <p class="text-sm mt-1">${v.caption}</p>
   </div>
   <div class="absolute bottom-20 right-2 flex flex-col gap-5 items-center">
     <button onclick="likeVid(${v.id})" class="flex flex-col items-center"><div class="w-12 h-12 bg-zinc-800/60 rounded-full flex items-center justify-center"><i class="fa-solid fa-heart ${v.liked?'text-red-500':'text-white'} text-xl"></i></div><span class="text-xs mt-1">${v.likes}</span></button>
     <button onclick="toggleFollow(${v.id})" class="flex flex-col items-center"><div class="w-12 h-12 bg-zinc-800/60 rounded-full flex items-center justify-center"><i class="fa-solid fa-user-plus text-xl"></i></div><span class="text-[10px]">${v.isFollowing?'Following':'Follow'}</span></button>
     <button class="flex flex-col items-center"><div class="w-12 h-12 bg-zinc-800/60 rounded-full flex items-center justify-center"><i class="fa-solid fa-share text-xl"></i></div><span class="text-xs">Share</span></button>
   </div>
 </div>
 `).join('');
 // Auto play first video
 setTimeout(()=>{let first=fd.querySelector('video'); if(first) first.play().catch(()=>{});},500);
}

function renderP(){
 let g=document.getElementById('pGrid');
 let no=document.getElementById('noVid');
 let count=document.getElementById('vidCount');
 if(!g)return;
 let myVids = DB.videos.filter(v=>v.owner===ME.handle);
 if(count) count.textContent = myVids.length + ' videos';
 if(myVids.length===0){ g.innerHTML=''; if(no) no.classList.remove('hidden'); return; }
 if(no) no.classList.add('hidden');
 // THIS IS THE FIX - REAL VIDEO NOT BLACK DIV
 g.innerHTML = myVids.map(v=>`
   <div class="aspect-[9/16] bg-zinc-900 overflow-hidden relative group cursor-pointer">
     <video src="${v.url}" muted playsinline preload="metadata" class="w-full h-full object-cover" onloadeddata="try{this.currentTime=0.2}catch(e){}" onmouseenter="this.play()" onmouseleave="this.pause();this.currentTime=0.2"></video>
     <div class="absolute bottom-1 left-1 text-[10px] flex items-center gap-1"><i class="fa-solid fa-play"></i> ${v.likes}</div>
   </div>
 `).join('');
}

function likeVid(id){
 let v=DB.videos.find(x=>x.id===id); if(!v)return;
 v.liked=!v.liked; v.likes+= v.liked?1:-1; save(); renderFeed(); renderP();
}
function toggleFollow(id){
 let v=DB.videos.find(x=>x.id===id); if(!v)return;
 v.isFollowing=!v.isFollowing; save(); renderFeed();
}
function switchTab(t){
 currentTab=t;
 document.getElementById('tabForYou').className = t==='foryou'? 'font-bold text-white border-b-2 border-white pb-1' : 'font-bold text-zinc-400';
 document.getElementById('tabFollowing').className = t==='following'? 'font-bold text-white border-b-2 border-white pb-1' : 'font-bold text-zinc-400';
 renderFeed();
}
function showPage(p){
 if(p==='feed'){ document.getElementById('feed').classList.remove('hidden'); document.getElementById('profilePage').classList.add('hidden'); renderFeed(); }
 else{ document.getElementById('feed').classList.add('hidden'); document.getElementById('profilePage').classList.remove('hidden'); renderP(); }
}

renderAll();
</script>
</body>
  </html>
