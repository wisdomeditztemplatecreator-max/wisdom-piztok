<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PizTok Fresh V600</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;overflow:hidden}.feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}.item{height:100vh;width:100vw;scroll-snap-align:start;position:relative;background:#000;display:flex;justify-content:center}.item video{height:100%;width:100%;max-width:430px;object-fit:cover}.info{position:absolute;bottom:100px;left:12px;right:80px;z-index:5}.right{position:absolute;right:10px;bottom:110px;display:flex;flex-direction:column;gap:20px;align-items:center;z-index:5}.nav{position:fixed;bottom:0;left:0;right:0;height:65px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:100}</style></head><body>
<div style="position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:center;gap:20px;padding:12px;background:linear-gradient(#000,transparent)"><b style="border-bottom:2px solid #fff">For You</b><b style="color:#888">Following</b></div>
<div class="feed" id="feed"></div>
<div class="nav"><div><i class="fa-solid fa-house"></i><br><span style="font-size:10px">Home</span></div><div><i class="fa-solid fa-search"></i><br><span style="font-size:10px">Search</span></div><div onclick="document.getElementById('file').click()" style="background:#fff;color:#000;width:44px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center"><i class="fa-solid fa-plus"></i></div><div><i class="fa-solid fa-music"></i><br><span style="font-size:10px">Sounds</span></div><div><i class="fa-regular fa-user"></i><br><span style="font-size:10px">You</span></div></div>
<input type="file" id="file" accept="video/*" hidden>
<script>
let vids=[{u:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",o:"piztok_official",c:"Welcome to FRESH PizTok V600 🔥 #fyp"},{u:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",o:"asake",c:"Lonely at the top challenge!"},{u:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",o:"ayrastarr",c:"Rush vibes 💃"},{u:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",o:"rema",c:"Calm down 😎"}];
let feed=document.getElementById('feed');
function render(){feed.innerHTML=vids.map((v,i)=>`<div class="item"><video src="${v.u}" loop muted playsinline id="v${i}"></video><div class="info"><b>@${v.o}</b><p style="margin-top:4px;font-size:14px">${v.c}</p><p style="font-size:11px;color:#25f4ee;margin-top:4px">🎵 Original sound</p></div><div class="right"><div style="width:46px;height:46px;border-radius:50%;background:#444;display:flex;align-items:center;justify-content:center;border:2px solid #fff">@</div><div><span style="font-size:24px">❤️</span><br><span style="font-size:11px">1.2K</span></div><div><i class="fa-solid fa-comment-dots" style="font-size:22px"></i><br><span style="font-size:11px">45</span></div><div><i class="fa-solid fa-share" style="font-size:20px"></i></div></div></div>`).join('');setTimeout(()=>{let a=document.querySelector('video');if(a){a.play().catch(()=>{});}let io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.play().catch(()=>{});}else e.target.pause();})},{threshold:.6});document.querySelectorAll('video').forEach(v=>io.observe(v));},300);}
document.getElementById('file').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let url=URL.createObjectURL(f);vids.unshift({u:url,o:"you",c:"My new video 🔥 #piztok"});render();});
render();
</script></body></html>
